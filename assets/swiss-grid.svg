<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Jake Smith - Computer Engineering, Ritsumeikan University">
  <title>Jake Smith</title>
  <desc>A twelve-column grid drawn rather than hidden. Everything sits on a column edge or a baseline; the single red is the only thing allowed to break the black.</desc>
  <defs>
    <!-- Twelve columns across a 1056 measure: 72 gutter, 76 column, 24 gap.
         Drawn at 6% so the structure is legible without competing. -->
    <pattern id="sg-col" x="72" y="0" width="88" height="420" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="76" height="420" fill="#0f0f0f" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#f2f0eb"/>
  <rect x="72" y="0" width="1056" height="420" fill="url(#sg-col)"/>

  <!-- Baselines. A Swiss layout is a grid in both directions. -->
  <g stroke="#0f0f0f" opacity="0.09">
    <line x1="72" y1="72" x2="1128" y2="72"/>
    <line x1="72" y1="156" x2="1128" y2="156"/>
    <line x1="72" y1="240" x2="1128" y2="240"/>
    <line x1="72" y1="324" x2="1128" y2="324"/>
  </g>

  <!-- Head rule, full measure, heavy. -->
  <rect x="72" y="42" width="1056" height="6" fill="#0f0f0f"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Inter', system-ui, sans-serif">
    <!-- running head, columns 1-4 and 9-12 -->
    <text x="72" y="66" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6d6a63" letter-spacing="4">COMPUTER ENGINEERING</text>
    <text x="1128" y="66" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6d6a63" letter-spacing="4">BOSTON / OSAKA · 2026</text>

    <!-- Name: columns 1–7, set to the baseline at 240. -->
    <text x="66" y="236" font-size="140" font-weight="700" fill="#0f0f0f" letter-spacing="-7">Jake</text>
    <text x="470" y="236" font-size="140" font-weight="700" fill="#185adb" letter-spacing="-7">Smith</text>

    <!-- Statement: columns 9–12, ragged right, top-aligned to the 156 baseline. -->
    <text x="864" y="106" font-size="17" font-weight="500" fill="#0f0f0f">Student. Builder.</text>
    <text x="864" y="130" font-size="17" font-weight="500" fill="#0f0f0f">Founder of</text>
    <text x="864" y="154" font-size="17" font-weight="500" fill="#0f0f0f">VisionPath.</text>
    <rect x="864" y="176" width="44" height="4" fill="#185adb"/>

    <!-- Index row, one entry per three columns, on the 324 baseline. -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <text x="72" y="290" fill="#6d6a63" letter-spacing="3">01</text>
      <text x="72" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f0f0f">Hackathons</text>
      <text x="72" y="334" fill="#6d6a63">Oxford · Recruit Holdings</text>

      <text x="336" y="290" fill="#6d6a63" letter-spacing="3">02</text>
      <text x="336" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f0f0f">University</text>
      <text x="336" y="334" fill="#6d6a63">PBL 3 · PBL 4</text>

      <text x="600" y="290" fill="#6d6a63" letter-spacing="3">03</text>
      <text x="600" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f0f0f">Research</text>
      <text x="600" y="334" fill="#6d6a63">The Shaky Walker Effect</text>

      <text x="864" y="290" fill="#6d6a63" letter-spacing="3">04</text>
      <text x="864" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f0f0f">People &amp; care</text>
      <text x="864" y="334" fill="#6d6a63">PENCIL Bridge · MemoryPath</text>
    </g>

    <!-- Foot rule and colophon -->
    <rect x="72" y="366" width="1056" height="1.5" fill="#0f0f0f"/>
    <text x="72" y="390" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6d6a63" letter-spacing="3">RITSUMEIKAN UNIVERSITY</text>
    <text x="1128" y="390" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6d6a63" letter-spacing="3">VISIONPATH.TECH · @JSMITTY78</text>
  </g>
</svg>
